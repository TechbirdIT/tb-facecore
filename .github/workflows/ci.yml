name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # no submodules: the deepface fork is upstream and not exercised by unit tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libs for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install facecore + ai_service
        # ai_service imports facecore (InsightFace engine) at runtime, so both
        # are installed editable. facecore pulls numpy/opencv/onnxruntime.
        run: pip install -e facecore -e "ai_service[dev]"
      - name: Lint (ruff)
        run: cd ai_service && ruff check .
      - name: Type check (mypy)
        run: cd ai_service && mypy src
      - name: Run tests
        run: cd ai_service && pytest -v
