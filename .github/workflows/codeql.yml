name: CodeQL
on:
  push:
    branches: [main, saurabh-test-dev]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          # The deepface fork is vendored under vendor/ as a submodule; it is
          # upstream code we do not maintain, so it is excluded from analysis.
          config: |
            paths-ignore:
              - vendor
      - uses: github/codeql-action/analyze@v3
