<style>
  html,body{margin:0;padding:0;background:#02060f;}
  *{box-sizing:border-box;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(0,120,200,0.25);border-radius:8px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(0,150,255,0.45);background-clip:content-box;}
  @keyframes hblink{0%,100%{opacity:0.4;}50%{opacity:1;}}
  @keyframes hscan{0%{transform:translateY(-120%);}100%{transform:translateY(2200%);}}
  @keyframes hdrift{0%{background-position:0 0;}100%{background-position:40px 0;}}
  @keyframes hpop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes hslide{from{transform:translateX(-8px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes htoast{from{transform:translate(-50%,12px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}
  @keyframes hspin{to{transform:rotate(360deg);}}
  .hin{padding:9px 11px;border-radius:9px;background:rgba(0,8,20,0.7);color:rgba(210,235,255,0.95);
    border:1px solid rgba(0,150,255,0.18);outline:none;width:100%;font-family:inherit;font-size:12.5px;
    transition:border-color .2s, box-shadow .2s;}
  .hin:focus{border-color:rgba(0,170,255,0.6);box-shadow:0 0 0 3px rgba(0,150,255,0.12);}
  .hbtn{transition:filter .3s, transform .15s;}
  .hbtn:hover{filter:brightness(1.18);}
  .hbtn:active{transform:translateY(1px) scale(0.99);}
  .hnav{transition:all .3s;}
  .hdel:hover{border-color:rgba(255,70,90,0.6) !important;background:rgba(60,12,20,0.6) !important;}
  .hadd:hover{border-color:rgba(0,200,255,0.6) !important;background:rgba(0,30,60,0.4) !important;}
  .hsave:hover{filter:brightness(1.15);}
  .hsave:active{transform:translateY(1px);}
  .hreset:hover{border-color:rgba(0,170,255,0.55) !important;color:rgba(190,225,255,0.9) !important;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

const EMPLOYEES = ["Martin Mwangi","Aisha Noor","David Otieno","Grace Wanjiru","Brian Kamau","Faith Chebet"];
const LS_KEY = "face_edge_console_hud_v1";

const DEFAULT_CFG = {
  frappe:{ url:"http://localhost:8002", api_key:"b3131f4b9033d51", api_secret:"830d1b34f0d2115" },
  cameras:[
    // preview: .mjpg → annotated engine feed (real boxes + IDs) · .m3u8 → raw HLS
    // video · blank → simulated demo.
    { id:"edge-001", source:"rtsp://192.168.1.68:8554", area:"Floor 2", preview:"http://127.0.0.1:9101/edge-001.mjpg" },
    { id:"edge-002", source:"rtsp://192.168.1.69:554/Streaming/Channels/102", area:"Lobby", preview:"" },
    { id:"edge-003", source:"0", area:"Lab", preview:"" },
  ],
  matching:{ threshold:0.45, liveness_threshold:0.6, min_det_score:0.5 },
  tracking:{ iou_threshold:0.3, max_misses:15, reverify_seconds:30, acquire_fast_seconds:2, acquire_backoff_seconds:1 },
  sighting_interval_seconds:60,
  rtsp:{ rtsp_transport:"tcp", rtsp_timeout_seconds:10 },
};

function loadCfg(){
  try{ const v = JSON.parse(localStorage.getItem(LS_KEY)); if(v && v.cameras) return v; }catch(e){}
  return structuredClone(DEFAULT_CFG);
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hhmmss=d=>d.toTimeString().slice(0,8);

const PILL = {
  green:{ c:"rgba(0,255,150,1)", b:"rgba(0,255,150,0.12)", r:"rgba(0,255,150,0.4)" },
  amber:{ c:"rgba(255,190,90,1)", b:"rgba(255,190,90,0.12)", r:"rgba(255,190,90,0.4)" },
  red:{   c:"rgba(255,70,90,1)",  b:"rgba(255,70,90,0.12)",  r:"rgba(255,70,90,0.4)" },
  blue:{  c:"rgba(0,180,255,1)",  b:"rgba(0,150,255,0.12)",  r:"rgba(0,150,255,0.4)" },
  muted:{ c:"rgba(130,170,210,0.8)", b:"rgba(120,160,200,0.1)", r:"rgba(120,160,200,0.3)" },
};

// ---------- atoms ----------
function Pill({tone="muted", label, blink, dot=true, size=10.5}){
  const m = PILL[tone] || PILL.muted;
  return <span style={{display:"inline-flex",alignItems:"center",gap:7,padding:"4px 11px",borderRadius:999,
      fontSize:size,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",
      color:m.c,background:m.b,border:`1px solid ${m.r}`}}>
    {dot && <span style={{width:6,height:6,borderRadius:"50%",background:m.c,boxShadow:`0 0 8px ${m.c}`,
      animation:blink?"hblink 1.6s infinite":"none"}}/>}
    {label}</span>;
}

// Real HLS feed (.m3u8) — low-latency live with catch-up. MJPEG uses a plain <img>.
function HlsVideo({src}){
  const ref = useRef(null);
  useEffect(()=>{
    const v = ref.current; if(!v || !src) return;
    let hls = null;
    if(window.Hls && Hls.isSupported()){
      hls = new Hls({ lowLatencyMode:true, liveSyncDurationCount:1, liveMaxLatencyDurationCount:4,
        maxLiveSyncPlaybackRate:1.6, backBufferLength:2, maxBufferLength:4 });
      hls.loadSource(src); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>v.play().catch(()=>{}));
    } else if (v.canPlayType("application/vnd.apple.mpegurl")){
      v.src = src; v.addEventListener("loadedmetadata", ()=>v.play().catch(()=>{}));
    }
    return ()=>{ if(hls) hls.destroy(); };
  },[src]);
  return <video ref={ref} muted autoPlay playsInline
    style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",background:"#000"}}/>;
}

// ---------- header ----------
function Header({engine, view, setView, onToggle}){
  const running = engine==="running";
  const synced = 12;
  const VB = {
    confirm:{ bd:"rgba(0,255,150,0.5)", bg:"rgba(0,60,30,0.55)", fg:"rgba(140,255,210,1)", glow:"0 0 22px rgba(0,255,150,0.28), inset 0 0 12px rgba(0,0,0,0.7)", ts:"0 0 10px rgba(0,255,120,0.5)", dot:"rgba(0,255,150,1)", stripe:"rgba(0,255,150,0.22)" },
    abort:{   bd:"rgba(255,70,90,0.55)", bg:"rgba(60,10,18,0.55)", fg:"rgba(255,150,165,1)", glow:"0 0 22px rgba(255,70,90,0.28), inset 0 0 12px rgba(0,0,0,0.7)", ts:"0 0 10px rgba(255,60,80,0.5)", dot:"rgba(255,70,90,1)", stripe:"rgba(255,70,90,0.22)" },
    starting:{ bd:"rgba(255,190,90,0.55)", bg:"rgba(50,34,8,0.55)", fg:"rgba(255,212,150,1)", glow:"0 0 22px rgba(255,190,90,0.24), inset 0 0 12px rgba(0,0,0,0.7)", ts:"0 0 10px rgba(255,190,90,0.5)", dot:"rgba(255,190,90,1)", stripe:"rgba(255,190,90,0.22)" },
  };
  const vb = VB[running?"abort":(engine==="starting"?"starting":"confirm")];
  const btnLabel = running ? "Stop engine" : (engine==="starting" ? "Starting…" : "Start engine");
  const navBtn = (v,label)=>{
    const on = view===v;
    return <button className="hnav" onClick={()=>setView(v)} style={{border:0,cursor:"pointer",
        fontFamily:"inherit",fontSize:11,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",
        padding:"0 16px",height:36,borderRadius:11,
        color:on?"rgba(140,255,210,1)":"rgba(0,160,255,0.6)",
        background:on?"rgba(0,60,30,0.5)":"transparent",
        boxShadow:on?"inset 0 0 12px rgba(0,255,150,0.3)":"none"}}>{label}</button>;
  };
  return (
    <header style={{position:"sticky",top:0,zIndex:20,display:"flex",alignItems:"center",gap:18,
        padding:"13px 26px",borderBottom:"1px solid rgba(0,150,255,0.15)",background:"rgba(2,8,18,0.72)",
        backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)"}}>
      <div style={{display:"flex",alignItems:"center",gap:13}}>
        <div style={{position:"relative",width:40,height:40,display:"grid",placeContent:"center",borderRadius:11,
            border:"1px solid rgba(0,170,255,0.5)",background:"radial-gradient(circle, rgba(0,60,130,0.8), rgba(0,18,44,0.9))",
            boxShadow:"0 0 18px rgba(0,150,255,0.25), inset 0 0 14px rgba(0,150,255,0.3)"}}>
          <div style={{width:13,height:13,borderRadius:"50%",border:"2px solid rgba(120,210,255,0.95)",
            boxShadow:"0 0 10px rgba(0,180,255,0.8), inset 0 0 6px rgba(0,180,255,0.6)"}}/>
          <div style={{position:"absolute",inset:5,borderRadius:9,border:"1px solid transparent",
            borderTopColor:"rgba(0,200,255,0.55)",borderRightColor:"rgba(0,200,255,0.2)",animation:"hspin 5s linear infinite"}}/>
        </div>
        <div style={{lineHeight:1.25}}>
          <div style={{fontFamily:"'Space Grotesk',sans-serif",fontWeight:600,fontSize:15,letterSpacing:1,
            color:"rgba(222,242,255,0.96)",textShadow:"0 0 18px rgba(0,130,255,0.3)"}}>FACECORE EDGE</div>
          <div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"rgba(0,150,255,0.55)"}}>tb-facecore · console</div>
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginLeft:6}}>
        <Pill tone={running?"green":engine==="starting"?"amber":"muted"} label={"Engine "+engine} blink={engine!=="stopped"}/>
        <Pill tone={engine==="stopped"?"muted":"blue"} label={engine==="stopped"?"Frappe idle":"Frappe linked"} blink={engine!=="stopped"}/>
        <Pill tone="muted" label={"Embeddings "+synced} dot={false}/>
      </div>

      <span style={{flex:1}}/>

      <nav style={{display:"flex",gap:4,padding:4,borderRadius:14,background:"rgba(0,20,44,0.5)",
        border:"1px solid rgba(0,150,255,0.2)",boxShadow:"inset 0 0 10px rgba(0,0,0,0.6)"}}>
        {navBtn("console","Live Console")}
        {navBtn("config","Configuration")}
      </nav>

      <button className="hbtn" onClick={onToggle} disabled={engine==="starting"}
        style={{position:"relative",display:"inline-flex",alignItems:"center",gap:10,height:46,padding:"0 22px",
          borderRadius:26,border:`1px solid ${vb.bd}`,background:vb.bg,color:vb.fg,fontFamily:"inherit",
          fontSize:12,fontWeight:600,letterSpacing:2,textTransform:"uppercase",cursor:engine==="starting"?"default":"pointer",
          overflow:"hidden",textShadow:vb.ts,boxShadow:vb.glow,backdropFilter:"blur(5px)",opacity:engine==="starting"?0.85:1}}>
        <span style={{position:"absolute",inset:0,opacity:0.45,pointerEvents:"none",
          background:`repeating-linear-gradient(90deg, ${vb.stripe} 0px, ${vb.stripe} 5px, transparent 5px, transparent 15px)`,
          animation:"hdrift 3s linear infinite",
          WebkitMaskImage:"linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)",
          maskImage:"linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)"}}/>
        <span style={{position:"relative",width:9,height:9,borderRadius:"50%",background:vb.dot,
          boxShadow:`0 0 10px ${vb.dot}`,animation:"hblink 1.6s infinite"}}/>
        <span style={{position:"relative"}}>{btnLabel}</span>
      </button>
    </header>
  );
}

// ---------- camera tile ----------
function CameraTile({cam, sim, running}){
  const offline = !running;
  const reconnecting = !!(sim && sim.status==="reconnecting");
  const src = cam.preview || cam.hls || "";
  const isMjpeg = /\.mjpe?g(\?|$)/i.test(src);
  const isLive = !!src && !offline && !reconnecting;
  const showSim = !offline && !reconnecting && !isLive;
  const showCenter = offline || reconnecting;

  let statusTone, statusLabel;
  if(offline){ statusTone="muted"; statusLabel="Offline"; }
  else if(reconnecting){ statusTone="amber"; statusLabel="Reconnect"; }
  else { statusTone="green"; statusLabel="Online"; }

  let viewportBg;
  if(offline) viewportBg="repeating-linear-gradient(45deg, rgba(8,16,30,1), rgba(8,16,30,1) 10px, rgba(12,22,40,1) 10px, rgba(12,22,40,1) 20px)";
  else if(isLive) viewportBg="radial-gradient(130% 100% at 50% 0%, rgba(0,46,92,0.55), rgba(2,8,18,1))";
  else viewportBg="radial-gradient(120% 80% at 50% 0%, rgba(10,40,80,0.55), rgba(4,10,22,1))";

  const fps = offline ? "—" : (reconnecting ? "0" : (isLive ? "live" : (sim ? String(sim.fps) : "—")));
  const tracks = (offline||reconnecting) ? 0 : (isLive ? "—" : (sim ? sim.faces.length : 0));
  const feedNote = isMjpeg ? "real feed · engine boxes" : "real feed · HLS video";

  return (
    <div style={{position:"relative",display:"flex",flexDirection:"column",borderRadius:16,overflow:"hidden",
        border:"1px solid rgba(0,150,255,0.2)",background:"rgba(6,18,38,0.55)",
        boxShadow:"0 10px 30px rgba(0,0,0,0.4), inset 0 0 24px rgba(0,80,180,0.06)",backdropFilter:"blur(4px)"}}>
      <div style={{display:"flex",alignItems:"center",gap:9,padding:"10px 13px",borderBottom:"1px solid rgba(0,150,255,0.14)"}}>
        <span style={{fontWeight:700,fontSize:12.5,letterSpacing:1,color:"rgba(210,235,255,0.95)"}}>{cam.id}</span>
        <span style={{fontSize:10.5,letterSpacing:1,color:"rgba(110,150,190,0.7)",textTransform:"uppercase"}}>· {cam.area||"—"}</span>
        <span style={{flex:1}}/>
        <Pill tone={statusTone} label={statusLabel} blink={!offline} size={10}/>
      </div>

      <div style={{position:"relative",aspectRatio:"16/10",overflow:"hidden",background:viewportBg}}>
        <div style={{position:"absolute",top:7,left:7,width:13,height:13,borderTop:"1.5px solid rgba(0,170,255,0.4)",borderLeft:"1.5px solid rgba(0,170,255,0.4)",pointerEvents:"none"}}/>
        <div style={{position:"absolute",bottom:7,right:7,width:13,height:13,borderBottom:"1.5px solid rgba(0,170,255,0.4)",borderRight:"1.5px solid rgba(0,170,255,0.4)",pointerEvents:"none"}}/>
        <div style={{position:"absolute",inset:0,pointerEvents:"none",opacity:0.5,
          background:"linear-gradient(transparent 50%, rgba(0,150,255,0.05) 50%)",backgroundSize:"100% 4px"}}/>

        {showCenter && <div style={{position:"absolute",inset:0,display:"grid",placeContent:"center",textAlign:"center",gap:5,padding:"0 14px"}}>
          <div style={{color:"rgba(120,160,200,0.78)",fontSize:12,letterSpacing:1}}>{offline?"— node offline —":"reconnecting…"}</div>
          <div style={{color:"rgba(90,130,170,0.6)",fontSize:10.5,letterSpacing:0.5}}>
            {offline?"press START ENGINE to acquire":("rtsp · "+(cam.source.startsWith("rtsp")?"tcp":"local"))}</div>
        </div>}

        {isLive && <>
          {isMjpeg
            ? <img src={src} alt="" onError={e=>{e.target.style.opacity=0;}}
                style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>
            : <HlsVideo src={src}/>}
          <div style={{position:"absolute",top:10,left:10,display:"flex",gap:6,alignItems:"center",padding:"3px 9px",
            borderRadius:999,fontSize:10,fontWeight:700,letterSpacing:1.5,color:"#021018",
            background:"rgba(0,255,150,0.95)",boxShadow:"0 0 14px rgba(0,255,150,0.5)"}}>
            <span style={{width:6,height:6,borderRadius:"50%",background:"#021018",animation:"hblink 1.2s infinite"}}/>LIVE</div>
          <div style={{position:"absolute",left:"50%",top:"50%",transform:"translate(-50%,-50%)",width:54,height:54,
            border:"1px solid rgba(0,200,255,0.3)",borderRadius:"50%",pointerEvents:"none",boxShadow:"0 0 16px rgba(0,150,255,0.2)"}}/>
          <div style={{position:"absolute",bottom:8,right:11,fontSize:10,letterSpacing:0.5,color:"rgba(150,195,235,0.7)"}}>{feedNote}</div>
        </>}

        {showSim && <>
          <div style={{position:"absolute",left:0,right:0,height:"16%",
            background:"linear-gradient(rgba(0,180,255,0.16),transparent)",animation:"hscan 4.5s linear infinite",pointerEvents:"none"}}/>
          {(sim?sim.faces:[]).map(f=>{
            const matched=!!f.name, live=f.liveness>=0.6;
            const bracket=matched?"rgba(0,255,150,0.95)":"rgba(0,190,255,0.85)";
            const box=matched?"rgba(0,255,150,0.5)":"rgba(0,170,255,0.4)";
            const glow=matched?"0 0 18px rgba(0,255,150,0.25)":"none";
            const liveColor=live?"rgba(0,255,150,1)":"rgba(255,190,90,1)";
            const liveBorder=live?"rgba(0,255,150,0.4)":"rgba(255,190,90,0.4)";
            const liveBg=live?"rgba(0,255,150,0.14)":"rgba(255,190,90,0.14)";
            const br=(pos)=>{ const s={position:"absolute",width:9,height:9}; if(pos.includes("t")){s.top=-1;s.borderTop=`2px solid ${bracket}`;} if(pos.includes("b")){s.bottom=-1;s.borderBottom=`2px solid ${bracket}`;} if(pos.includes("l")){s.left=-1;s.borderLeft=`2px solid ${bracket}`;} if(pos.includes("r")){s.right=-1;s.borderRight=`2px solid ${bracket}`;} return s; };
            return <div key={f.key} style={{position:"absolute",left:f.x+"%",top:f.y+"%",width:f.w+"%",height:f.h+"%",
                transition:"left .7s linear, top .7s linear, width .7s linear, height .7s linear"}}>
              <div style={{position:"absolute",inset:0,border:`1px solid ${box}`,borderRadius:3,boxShadow:glow}}/>
              <div style={br("tl")}/><div style={br("tr")}/><div style={br("bl")}/><div style={br("br")}/>
              {matched && <div style={{position:"absolute",left:-1,top:-23,display:"flex",gap:5,alignItems:"center",
                  whiteSpace:"nowrap",animation:"hpop .18s ease"}}>
                <span style={{fontSize:10,fontWeight:700,letterSpacing:0.3,color:"#021018",background:"rgba(0,255,150,0.95)",
                  padding:"2px 7px",borderRadius:4,boxShadow:"0 0 12px rgba(0,255,150,0.45)"}}>{f.name} {f.score.toFixed(2)}</span>
                <span style={{fontSize:9,fontWeight:700,letterSpacing:0.3,padding:"2px 6px",borderRadius:4,
                  color:liveColor,border:`1px solid ${liveBorder}`,background:liveBg}}>{live?"LIVE":"CHK"} {f.liveness.toFixed(2)}</span>
              </div>}
            </div>;
          })}
        </>}
      </div>

      <div style={{display:"flex",alignItems:"center",gap:16,padding:"8px 13px",fontSize:11,letterSpacing:0.5,
          color:"rgba(150,195,235,0.55)",borderTop:"1px solid rgba(0,150,255,0.1)"}}>
        <span>FPS <b style={{color:"rgba(0,255,150,0.9)"}}>{fps}</b></span>
        <span>TRK <b style={{color:"rgba(222,242,255,0.9)"}}>{tracks}</b></span>
        <span style={{flex:1}}/>
        <span style={{fontSize:10,color:"rgba(90,130,170,0.7)",maxWidth:"56%",overflow:"hidden",
          textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cam.source}</span>
      </div>
    </div>
  );
}

// ---------- console view ----------
function ConsoleView({cfg, sim, events, running}){
  const totalTracks = Object.values(sim).reduce((n,s)=>n+(s.status==="online"?s.faces.length:0),0);
  return (
    <div>
      <div style={{display:"flex",alignItems:"baseline",gap:16,borderBottom:"1px solid rgba(0,150,255,0.15)",
          paddingBottom:13,marginBottom:22}}>
        <span style={{fontSize:11,letterSpacing:2,color:"rgba(0,150,255,0.6)"}}>01</span>
        <h2 style={{margin:0,fontSize:13,letterSpacing:3,textTransform:"uppercase",fontWeight:500,color:"rgba(200,230,255,0.9)"}}>Live recognition grid</h2>
        <div style={{marginLeft:"auto",display:"flex",gap:22,fontSize:12,letterSpacing:1,color:"rgba(150,195,235,0.55)"}}>
          <span>NODES <b style={{color:"rgba(222,242,255,0.95)"}}>{cfg.cameras.length}</b></span>
          <span>TRACKS <b style={{color:"rgba(0,255,150,0.95)"}}>{totalTracks}</b></span>
          <span>EVENTS <b style={{color:"rgba(222,242,255,0.95)"}}>{events.length}</b></span>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) 360px",gap:20,alignItems:"start"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(330px,1fr))",gap:18}}>
          {cfg.cameras.map(cam=><CameraTile key={cam.id} cam={cam} sim={sim[cam.id]} running={running}/>)}
          {cfg.cameras.length===0 && <div style={{gridColumn:"1/-1",padding:46,textAlign:"center",
            color:"rgba(110,150,190,0.6)",fontSize:12,letterSpacing:1,border:"1px dashed rgba(0,150,255,0.2)",borderRadius:16}}>
            NO NODES CONFIGURED · add cameras in Configuration</div>}
        </div>

        <div style={{position:"sticky",top:88}}>
          <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 130px)",minHeight:440,borderRadius:16,
              overflow:"hidden",border:"1px solid rgba(0,150,255,0.2)",background:"rgba(6,18,38,0.55)",
              boxShadow:"0 10px 30px rgba(0,0,0,0.4), inset 0 0 24px rgba(0,80,180,0.06)",backdropFilter:"blur(4px)"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,padding:"13px 15px",borderBottom:"1px solid rgba(0,150,255,0.14)"}}>
              <span style={{fontSize:11,letterSpacing:2,color:"rgba(0,150,255,0.6)"}}>02</span>
              <b style={{fontSize:12,letterSpacing:2,textTransform:"uppercase",fontWeight:600,color:"rgba(200,230,255,0.9)"}}>Recognitions</b>
              <span style={{flex:1}}/>
              <Pill tone={running?"green":"muted"} label={running?"Live":"Idle"} blink={running} size={10}/>
            </div>
            <div style={{flex:1,overflow:"auto",padding:8}}>
              {events.map(ev=>(
                <div key={ev.key} style={{display:"grid",gridTemplateColumns:"1fr auto",gap:"3px 8px",padding:"9px 11px",
                    borderRadius:10,marginBottom:5,background:"rgba(0,12,28,0.6)",border:"1px solid rgba(0,150,255,0.1)",
                    animation:"hslide .25s ease"}}>
                  <span style={{fontWeight:600,fontSize:13,color:"rgba(210,235,255,0.95)"}}>{ev.name}</span>
                  <span style={{fontSize:11,color:"rgba(110,150,190,0.7)"}}>{ev.time}</span>
                  <span style={{fontSize:10.5,letterSpacing:0.5,color:"rgba(150,195,235,0.55)",textTransform:"uppercase"}}>{ev.cam} · {ev.area}</span>
                  <span style={{fontSize:11,justifySelf:"end"}}>
                    <span style={{color:"rgba(0,200,255,0.95)"}}>{ev.score.toFixed(2)}</span>
                    <span style={{color:"rgba(110,150,190,0.55)"}}> / {ev.liveness.toFixed(2)}</span></span>
                </div>
              ))}
              {events.length===0 && <div style={{padding:"34px 16px",textAlign:"center",color:"rgba(110,150,190,0.6)",
                fontSize:12,letterSpacing:0.5,lineHeight:1.7}}>
                {running?"No events yet · watching nodes…":"Engine idle · start to begin recognition"}</div>}
            </div>
            <div style={{padding:"11px 15px",borderTop:"1px solid rgba(0,150,255,0.12)",fontSize:10,lineHeight:1.7,
              letterSpacing:0.5,color:"rgba(90,130,170,0.7)"}}>
              Sightings become <b style={{color:"rgba(150,195,235,0.85)"}}>presence sessions</b> server-side — hours per area.</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- config view ----------
function Section({tag, title, children}){
  return <section style={{background:"rgba(6,18,38,0.5)",border:"1px solid rgba(0,150,255,0.16)",borderRadius:16,
      padding:"18px 20px",marginBottom:16}}>
    <div style={{display:"flex",alignItems:"baseline",gap:14,borderBottom:"1px solid rgba(0,150,255,0.12)",
        paddingBottom:11,marginBottom:16}}>
      <span style={{fontSize:11,letterSpacing:2,color:"rgba(0,150,255,0.6)"}}>{tag}</span>
      <h3 style={{margin:0,fontSize:13,letterSpacing:2,textTransform:"uppercase",fontWeight:600,color:"rgba(200,230,255,0.9)"}}>{title}</h3>
    </div>
    {children}
  </section>;
}
const lblStyle = {fontSize:10.5,letterSpacing:1.5,textTransform:"uppercase",color:"rgba(150,195,235,0.65)",fontWeight:600};
const hintStyle = {fontSize:10.5,color:"rgba(90,130,170,0.65)"};
function Labeled({label, hint, children}){
  return <label style={{display:"grid",gap:6}}><span style={lblStyle}>{label}</span>{children}{hint&&<span style={hintStyle}>{hint}</span>}</label>;
}
function NumField({label, hint, step, value, onChange}){
  return <Labeled label={label} hint={hint}><input className="hin" type="number" step={step}
    value={value} onChange={e=>onChange(parseFloat(e.target.value))}/></Labeled>;
}

function ConfigView({cfg, setCfg, onSave}){
  const set=(path,val)=>{ const c=structuredClone(cfg); let o=c; const ks=path.split("."); for(let i=0;i<ks.length-1;i++)o=o[ks[i]]; o[ks[ks.length-1]]=val; setCfg(c); };
  const setCam=(i,k,v)=>{ const c=structuredClone(cfg); c.cameras[i][k]=v; setCfg(c); };
  const addCam=()=>{ const c=structuredClone(cfg); const n=c.cameras.length+1; c.cameras.push({id:"edge-"+String(n).padStart(3,"0"),source:"rtsp://",area:"",preview:""}); setCfg(c); };
  const delCam=i=>{ const c=structuredClone(cfg); c.cameras.splice(i,1); setCfg(c); };
  const grid3 = {display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14};
  return (
    <div style={{maxWidth:960,margin:"0 auto"}}>
      <Section tag="A" title="Camera nodes">
        <p style={{margin:"0 0 16px",fontSize:11.5,lineHeight:1.6,color:"rgba(110,150,190,0.7)"}}>
          One row per camera on this machine — they share the loaded face models. Each ID must match a Face Edge Device in Frappe. Preview URL: <b style={{color:"rgba(0,255,150,0.8)"}}>.mjpg</b> = engine boxes · <b style={{color:"rgba(0,200,255,0.8)"}}>.m3u8</b> = raw video · blank = demo.</p>
        <div style={{display:"grid",gap:12}}>
          {cfg.cameras.map((cam,i)=>(
            <div key={i} style={{display:"grid",gap:8,padding:12,borderRadius:12,border:"1px solid rgba(0,150,255,0.14)",background:"rgba(0,12,28,0.5)"}}>
              <div style={{display:"grid",gridTemplateColumns:"150px 1fr 150px 40px",gap:9,alignItems:"center"}}>
                <input className="hin" value={cam.id} onChange={e=>setCam(i,"id",e.target.value)} placeholder="edge-001"/>
                <input className="hin" value={cam.source} onChange={e=>setCam(i,"source",e.target.value)} placeholder="rtsp://… or 0"/>
                <input className="hin" value={cam.area} onChange={e=>setCam(i,"area",e.target.value)} placeholder="Area"/>
                <button className="hdel" onClick={()=>delCam(i)} title="Remove node" style={{width:40,height:38,display:"grid",
                  placeContent:"center",borderRadius:9,border:"1px solid rgba(255,70,90,0.25)",background:"rgba(40,8,14,0.4)",
                  color:"rgba(255,110,125,0.9)",cursor:"pointer",fontFamily:"inherit",fontSize:13,transition:"all .2s"}}>✕</button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:10,alignItems:"center"}}>
                <span style={{fontSize:10,letterSpacing:1.5,textTransform:"uppercase",color:"rgba(90,130,170,0.7)",fontWeight:600}}>Preview</span>
                <input className="hin" style={{fontSize:11.5,color:"rgba(170,210,245,0.9)"}} value={cam.preview||cam.hls||""}
                  onChange={e=>setCam(i,"preview",e.target.value)}
                  placeholder="blank = demo · …:9101/edge-001.mjpg = boxes · …/stream.m3u8 = video"/>
              </div>
            </div>
          ))}
          <button className="hadd" onClick={addCam} style={{justifySelf:"start",marginTop:2,padding:"9px 15px",borderRadius:10,
            border:"1px dashed rgba(0,150,255,0.35)",background:"transparent",color:"rgba(0,200,255,0.85)",fontFamily:"inherit",
            fontSize:11,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",cursor:"pointer",transition:"all .2s"}}>+ Add node</button>
        </div>
      </Section>

      <Section tag="B" title="Frappe connection">
        <div style={grid3}>
          <Labeled label="Server URL"><input className="hin" value={cfg.frappe.url} onChange={e=>set("frappe.url",e.target.value)}/></Labeled>
          <Labeled label="API key"><input className="hin" value={cfg.frappe.api_key} onChange={e=>set("frappe.api_key",e.target.value)}/></Labeled>
          <Labeled label="API secret"><input className="hin" type="password" value={cfg.frappe.api_secret} onChange={e=>set("frappe.api_secret",e.target.value)}/></Labeled>
        </div>
      </Section>

      <Section tag="C" title="Matching & liveness">
        <div style={grid3}>
          <NumField label="Match threshold" hint="cosine 0–1 · higher = stricter" step="0.05" value={cfg.matching.threshold} onChange={v=>set("matching.threshold",v)}/>
          <NumField label="Liveness threshold" hint="reject photos/screens below" step="0.05" value={cfg.matching.liveness_threshold} onChange={v=>set("matching.liveness_threshold",v)}/>
          <NumField label="Min detector score" hint="ignore weak detections" step="0.05" value={cfg.matching.min_det_score} onChange={v=>set("matching.min_det_score",v)}/>
        </div>
      </Section>

      <Section tag="D" title="Tracking & sampling">
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))",gap:14}}>
          <NumField label="IoU threshold" hint="box overlap = same track" step="0.05" value={cfg.tracking.iou_threshold} onChange={v=>set("tracking.iou_threshold",v)}/>
          <NumField label="Max misses" hint="frames before drop" step="1" value={cfg.tracking.max_misses} onChange={v=>set("tracking.max_misses",v)}/>
          <NumField label="Re-verify (s)" hint="id-swap guard" step="1" value={cfg.tracking.reverify_seconds} onChange={v=>set("tracking.reverify_seconds",v)}/>
          <NumField label="Acquire fast (s)" hint="retry every frame" step="0.5" value={cfg.tracking.acquire_fast_seconds} onChange={v=>set("tracking.acquire_fast_seconds",v)}/>
          <NumField label="Acquire backoff (s)" hint="then retry unknowns" step="0.5" value={cfg.tracking.acquire_backoff_seconds} onChange={v=>set("tracking.acquire_backoff_seconds",v)}/>
          <NumField label="Sighting interval (s)" hint="how often presence logged" step="1" value={cfg.sighting_interval_seconds} onChange={v=>set("sighting_interval_seconds",v)}/>
        </div>
      </Section>

      <Section tag="E" title="RTSP transport">
        <div style={grid3}>
          <Labeled label="Transport" hint="TCP reliable · UDP clean LAN only">
            <select className="hin" value={cfg.rtsp.rtsp_transport} onChange={e=>set("rtsp.rtsp_transport",e.target.value)}>
              <option value="tcp">tcp</option><option value="udp">udp</option></select></Labeled>
          <NumField label="Socket timeout (s)" hint="reconnect instead of hang" step="1" value={cfg.rtsp.rtsp_timeout_seconds} onChange={v=>set("rtsp.rtsp_timeout_seconds",v)}/>
        </div>
      </Section>

      <div style={{display:"flex",gap:10,position:"sticky",bottom:0,padding:"14px 0 6px",
          background:"linear-gradient(transparent, #02060f 45%)"}}>
        <button className="hsave" onClick={onSave} style={{position:"relative",display:"inline-flex",alignItems:"center",gap:9,
          height:46,padding:"0 24px",borderRadius:26,border:"1px solid rgba(0,255,150,0.5)",background:"rgba(0,60,30,0.55)",
          color:"rgba(140,255,210,1)",fontFamily:"inherit",fontSize:12,fontWeight:600,letterSpacing:2,textTransform:"uppercase",
          cursor:"pointer",textShadow:"0 0 10px rgba(0,255,120,0.5)",boxShadow:"0 0 22px rgba(0,255,150,0.25), inset 0 0 12px rgba(0,0,0,0.6)"}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:"rgba(0,255,150,1)",boxShadow:"0 0 10px rgba(0,255,150,1)",animation:"hblink 1.6s infinite"}}/>
          Save configuration</button>
        <button className="hreset" onClick={()=>setCfg(structuredClone(DEFAULT_CFG))} style={{height:46,padding:"0 22px",borderRadius:26,
          border:"1px solid rgba(0,150,255,0.3)",background:"transparent",color:"rgba(150,195,235,0.7)",fontFamily:"inherit",
          fontSize:12,fontWeight:600,letterSpacing:2,textTransform:"uppercase",cursor:"pointer",transition:"all .2s"}}>Reset to defaults</button>
      </div>
    </div>
  );
}

// ---------- app ----------
function App(){
  const [cfg,setCfg]=useState(loadCfg);
  const [view,setView]=useState("console");
  const [engine,setEngine]=useState("stopped"); // stopped | starting | running
  const [sim,setSim]=useState({});
  const [events,setEvents]=useState([]);
  const [toast,setToast]=useState(null);
  const seq=useRef(0);
  const running=engine==="running";

  useEffect(()=>{ if(engine!=="starting") return;
    const t=setTimeout(()=>{
      const s={}; cfg.cameras.forEach(c=>{ s[c.id]={status:"online",fps:Math.round(rnd(11,15)),faces:[],rc:0}; });
      setSim(s); setEngine("running");
    },1900); return ()=>clearTimeout(t); },[engine]);

  useEffect(()=>{
    if(!running) return;
    const iv=setInterval(()=>{
      setSim(prev=>{
        const next={}; const newEvents=[];
        cfg.cameras.forEach(cam=>{
          if(cam.preview||cam.hls){ next[cam.id]={status:"online",fps:15,faces:[],rc:0}; return; }
          const cur=prev[cam.id]||{status:"online",fps:13,faces:[],rc:0};
          let {status,fps,faces,rc}=cur; faces=faces.map(f=>({...f}));
          if(status==="reconnecting"){ rc-=1; if(rc<=0){status="online";fps=Math.round(rnd(11,15));} next[cam.id]={status,fps,faces:[],rc}; return; }
          if(Math.random()<0.025){ next[cam.id]={status:"reconnecting",fps:0,faces:[],rc:Math.round(rnd(2,4))}; return; }
          fps=Math.max(9,Math.min(15,fps+Math.round(rnd(-1,1))));
          faces.forEach(f=>{ f.x+=f.vx; f.y+=f.vy;
            if(f.x<2||f.x>100-f.w-2)f.vx*=-1; if(f.y<6||f.y>100-f.h-2)f.vy*=-1;
            f.x=Math.max(2,Math.min(100-f.w-2,f.x)); f.y=Math.max(6,Math.min(100-f.h-2,f.y)); });
          if(faces.length<2 && Math.random()<0.3){ faces.push({key:"f"+(seq.current++),x:rnd(8,60),y:rnd(12,55),w:rnd(16,24),h:rnd(22,32),vx:rnd(-3,3),vy:rnd(-2,2),name:null,score:0,liveness:0,age:0}); }
          if(faces.length && Math.random()<0.12) faces.shift();
          faces.forEach(f=>{ f.age=(f.age||0)+1;
            if(!f.name && f.age>=2 && Math.random()<0.4){
              const sc=rnd(0.58,0.93), lv=rnd(0.55,0.97);
              if(sc>=cfg.matching.threshold){ f.name=pick(EMPLOYEES); f.score=sc; f.liveness=lv;
                if(lv>=cfg.matching.liveness_threshold){ newEvents.push({key:"e"+(seq.current++),name:f.name,cam:cam.id,area:cam.area||"—",time:hhmmss(new Date()),score:sc,liveness:lv}); }
              }
            }});
          next[cam.id]={status,fps,faces,rc};
        });
        if(newEvents.length) setEvents(ev=>[...newEvents.reverse(),...ev].slice(0,40));
        return next;
      });
    },800);
    return ()=>clearInterval(iv);
  },[running, cfg.cameras, cfg.matching.threshold, cfg.matching.liveness_threshold]);

  const save=()=>{ localStorage.setItem(LS_KEY,JSON.stringify(cfg)); setToast("Configuration saved");
    setTimeout(()=>setToast(null),2200); };
  const toggle=()=>{ if(engine==="stopped")setEngine("starting"); else {setEngine("stopped");setSim({});setEvents([]);} };

  return (
    <div style={{position:"relative",minHeight:"100vh",fontFamily:"'JetBrains Mono',ui-monospace,monospace",
        color:"rgba(198,228,255,0.92)",
        background:"radial-gradient(ellipse at 18% -6%, rgba(0,60,130,0.35) 0%, rgba(0,0,0,0) 55%), radial-gradient(ellipse at 92% 106%, rgba(0,80,60,0.22) 0%, rgba(0,0,0,0) 50%), #02060f"}}>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        backgroundImage:"linear-gradient(rgba(0,150,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(0,150,255,0.045) 1px, transparent 1px)",
        backgroundSize:"48px 48px"}}/>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(circle at 50% -10%, rgba(0,120,255,0.06), transparent 55%)"}}/>

      <div style={{position:"relative",zIndex:1}}>
        <Header engine={engine} view={view} setView={setView} onToggle={toggle}/>
        <main style={{maxWidth:1500,margin:"0 auto",padding:"24px 26px 64px"}}>
          {view==="console"
            ? <ConsoleView cfg={cfg} sim={sim} events={events} running={running}/>
            : <ConfigView cfg={cfg} setCfg={setCfg} onSave={save}/>}
        </main>
      </div>

      {toast && <div style={{position:"fixed",left:"50%",bottom:26,transform:"translateX(-50%)",zIndex:50,
        display:"flex",alignItems:"center",gap:9,padding:"12px 20px",borderRadius:26,border:"1px solid rgba(0,255,150,0.45)",
        background:"rgba(0,40,22,0.92)",color:"rgba(150,255,215,1)",fontSize:12,fontWeight:600,letterSpacing:1.5,
        textTransform:"uppercase",boxShadow:"0 12px 40px rgba(0,0,0,0.5), 0 0 24px rgba(0,255,150,0.25)",
        backdropFilter:"blur(8px)",animation:"htoast .25s ease"}}>
        <span style={{width:8,height:8,borderRadius:"50%",background:"rgba(0,255,150,1)",boxShadow:"0 0 10px rgba(0,255,150,1)"}}/>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
